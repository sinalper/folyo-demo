<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title id="t">Folyo demo</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--fg:#15181d;--card:#fff;--line:#c4c9d2;--accent:#1d4ed8;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--fg:#eceff3;--card:#1c1f24;--line:#4a515c;--accent:#8ab4ff;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{width:100%;max-width:22rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{font-size:1.25rem;margin:0 0 16px}
label{display:block;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
button{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--card);cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#s{min-height:1.5em;margin:12px 0 0}
#s.err{color:var(--err)}
</style>
</head>
<body>
<main>
<h1 id="h">Folyo</h1>
<form id="f" method="post" action="">
<label for="p" id="l">Demo password</label>
<input id="p" name="password" type="password" autocomplete="current-password" required aria-describedby="s">
<button id="b" type="submit">Enter</button>
</form>
<p id="s" role="status" aria-live="polite"></p>
<noscript><p>This page needs JavaScript.</p></noscript>
</main>
<script>
(() => {
  const C = {"api":"https://hqbukqxzrwqxjqaiafre.supabase.co/functions/v1/demo-gate","wait":false,"autoLang":true,"lang":"en","m":{"tr":{"title":"Folyo demosu","label":"Demo şifresi","button":"Giriş","wrong":"Şifre yanlış.","limited":"Çok fazla yanlış deneme. Lütfen {m} dakika sonra yeniden deneyin.","creating":"Sunucu açılıyor; bu genellikle 2–5 dakika sürer. Hazır olunca kendiliğinden geçilir.","starting":"Sunucu açılıyor; bu genellikle 2–5 dakika sürer. Hazır olunca kendiliğinden geçilir.","stopping":"Sunucu az önce kapanıyordu; kapanınca yeniden açılacak. Birkaç dakika sürebilir.","ready":"Hazır, yönlendiriliyorsunuz…","expired":"Sürenin dolması nedeniyle şifreyi yeniden girin.","error":"Bir sorun oluştu. Lütfen biraz sonra yeniden deneyin.","noscript":"Bu sayfa JavaScript gerektirir."},"en":{"title":"Folyo demo","label":"Demo password","button":"Enter","wrong":"Wrong password.","limited":"Too many wrong attempts. Please try again in {m} minutes.","creating":"Server starting, usually 2–5 minutes. You will be taken in when it is ready.","starting":"Server starting, usually 2–5 minutes. You will be taken in when it is ready.","stopping":"The server was just shutting down; it will start again afterwards. This can take a few minutes.","ready":"Ready, taking you in…","expired":"Time ran out; please enter the password again.","error":"Something went wrong. Please try again shortly.","noscript":"This page needs JavaScript."}}};
  let lang = C.lang;
  if (C.autoLang) {
    const l = (navigator.languages || [navigator.language || 'en']).map((x) => x.slice(0, 2).toLowerCase()).find((x) => x === 'tr' || x === 'en');
    if (l) lang = l;
    document.documentElement.lang = lang;
  }
  const M = C.m[lang];
  const $ = (id) => document.getElementById(id);
  $('t').textContent = M.title; $('l').textContent = M.label; $('b').textContent = M.button;
  const api = C.api || location.pathname;
  let gate = '';
  let timer = 0;
  const say = (text, err) => { $('s').textContent = text; $('s').className = err ? 'err' : ''; $('p').setAttribute('aria-invalid', err ? 'true' : 'false'); };
  const busy = (on) => { $('b').disabled = on; $('p').disabled = on; };
  function show(d) {
    if (d.url) { say(M.ready); location.replace(d.url); return; }
    if (d.gate) gate = d.gate;
    const s = d.state;
    if (s === 'creating' || s === 'starting' || s === 'stopping') {
      busy(true); say(M[s]); clearTimeout(timer); timer = setTimeout(poll, 5000); return;
    }
    busy(false);
    if (s === 'wrong' || s === 'expired') { say(M[s], true); $('p').value = ''; $('p').focus(); return; }
    if (s === 'limited') { say(M.limited.replace('{m}', String(Math.ceil((d.retryAfter || 600) / 60))), true); return; }
    say(M.error, true);
  }
  async function call(init, query) {
    try {
      const res = await fetch(api + (query || ''), Object.assign({ credentials: C.api ? 'omit' : 'same-origin', cache: 'no-store' }, init));
      show(await res.json().catch(() => ({})));
    } catch { busy(false); say(M.error, true); }
  }
  function poll() {
    call({ headers: gate ? { 'x-gate-token': gate } : {} }, '?status=1');
  }
  $('f').addEventListener('submit', (e) => {
    e.preventDefault();
    const password = $('p').value;
    if (!password) return;
    busy(true); say('');
    call({ method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password }) });
  });
  if (C.wait) { busy(true); poll(); }
})();
</script>
</body>
</html>
